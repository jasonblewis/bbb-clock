# bbb-clock: runtime config for the clock display binary (clock.c).
# Install to /etc/bbb-clock/clock.conf; clock reads it once at startup, so
# `systemctl restart clock` after editing. Missing file = all defaults.
#
# Per-digit brightness trim: multiplier 0..1 applied on top of the ambient-
# driven display brightness for one digit. Digits are numbered 0-3 from the
# right (0 = minutes units, 2 = hours units). Default 1.0 (untouched) for any
# digit not listed. Use it to match a replaced seven-segment display to the
# others: hold the display at a fixed level (`clock -t -g 100`, service
# stopped), compare by eye, adjust, restart; re-check at `-g 600`.
#
# 2026-10-31: hours-units display replaced after a segment failed; the new
# part is brighter than the aged originals. 0.7 matched at both levels.
digit_trim_2 = 0.7
